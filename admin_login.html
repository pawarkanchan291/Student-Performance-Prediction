<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    min-height: 100vh;

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    background: linear-gradient(
        135deg,
        #2563eb,
        #4f46e5
    );
}


/* =====================================================
   LOGIN CARD
===================================================== */

.login-container {

    width: 100%;

    max-width: 420px;

    padding: 20px;
}


.login-card {

    background: white;

    padding: 40px;

    border-radius: 18px;

    box-shadow:
        0 20px 50px rgba(
            0,
            0,
            0,
            0.20
        );

}


/* =====================================================
   ICON
===================================================== */

.admin-icon {

    width: 70px;

    height: 70px;

    margin: 0 auto 20px;

    display: flex;

    justify-content: center;

    align-items: center;

    border-radius: 50%;

    background: #eef2ff;

    font-size: 32px;
}


/* =====================================================
   TEXT
===================================================== */

.login-card h1 {

    text-align: center;

    color: #111827;

    margin-bottom: 8px;

}


.subtitle {

    text-align: center;

    color: #6b7280;

    font-size: 14px;

    margin-bottom: 30px;

}


/* =====================================================
   FORM
===================================================== */

.form-group {

    margin-bottom: 20px;

}


.form-group label {

    display: block;

    margin-bottom: 8px;

    color: #374151;

    font-weight: 600;

}


.form-group input {

    width: 100%;

    padding: 13px 14px;

    border: 1px solid #d1d5db;

    border-radius: 8px;

    outline: none;

    font-size: 15px;

    transition: 0.2s;

}


.form-group input:focus {

    border-color: #2563eb;

    box-shadow:
        0 0 0 3px
        rgba(
            37,
            99,
            235,
            0.10
        );

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

.login-button {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 8px;

    background: #2563eb;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;

}


.login-button:hover {

    background: #1d4ed8;

}


/* =====================================================
   ERROR MESSAGE
===================================================== */

.alert {

    padding: 12px;

    margin-bottom: 20px;

    border-radius: 8px;

    text-align: center;

    font-size: 14px;

}


.alert.error {

    background: #fee2e2;

    color: #991b1b;

}


/* =====================================================
   FOOTER
===================================================== */

.login-footer {

    text-align: center;

    margin-top: 25px;

    color: #9ca3af;

    font-size: 13px;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 480px) {

    .login-card {

        padding: 30px 20px;

    }

}

</style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <div class="admin-icon">
            🔐
        </div>


        <h1>
            Admin Login
        </h1>


        <p class="subtitle">
            Student Performance Prediction System
        </p>


        <!-- ERROR MESSAGE -->

        {% with messages =
            get_flashed_messages(
                with_categories=true
            )
        %}

            {% for category, message in messages %}

                <div class="alert {{ category }}">

                    {{ message }}

                </div>

            {% endfor %}

        {% endwith %}


        <!-- LOGIN FORM -->
<form action="http://127.0.0.1:5000/admin_login" method="POST">

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter admin email"
                    required
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >

                Login to Dashboard

            </button>


        </form>


        <div class="login-footer">

            Admin access only

        </div>


    </div>


</div>


</body>

</html>
