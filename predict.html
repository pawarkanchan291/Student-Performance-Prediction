<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Performance Prediction</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }


        .student-details-page {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }


        .student-details-box {
            width: 100%;
            max-width: 650px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,0.12);
        }


        h1 {
            text-align: center;

            color: #1e3a8a;

            margin-bottom: 10px;
        }


        .description {
            text-align: center;

            color: #666;

            margin-bottom: 30px;
        }


        label {
            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }


        input,
        select {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 16px;

            background: white;
        }


        input:focus,
        select:focus {

            border-color: #2563eb;

            outline: none;

        }


        select {

            cursor: pointer;

        }


        .predict-btn {

            width: 100%;

            margin-top: 25px;

            padding: 14px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 17px;

            cursor: pointer;

        }


        .predict-btn:hover {

            background: #1d4ed8;

        }


        .result {

            margin-top: 30px;

            padding: 20px;

            background: #eff6ff;

            border-radius: 10px;

            text-align: center;

        }


        .result h2 {

            color: #1e3a8a;

            margin-bottom: 10px;

        }


        .result p {

            font-size: 20px;

            font-weight: bold;

            color: #2563eb;

        }


        .back-links {

            text-align: center;

            margin-top: 20px;

        }


        .back-links a {

            color: #2563eb;

            text-decoration: none;

            margin: 0 8px;

        }


        .back-links a:hover {

            text-decoration: underline;

        }


        @media(max-width: 600px) {

            .student-details-box {

                padding: 25px;

            }

            h1 {

                font-size: 25px;

            }

        }

    </style>

</head>


<body>


    <div class="student-details-page">


        <div class="student-details-box">


            <h1>
                🎓 Student Performance Prediction
            </h1>


            <p class="description">
                Enter student details to predict performance
            </p>



            <!-- =================================
                 PREDICTION FORM
            ================================== -->
<form action="http://127.0.0.1:5000/predict" method="POST">


              <!-- Student ID -->

<label for="student_id">
    Student ID:
</label>

<input
    type="text"
    id="student_id"
    name="student_id"
    placeholder="Enter Student ID"
    required
>

                <!-- Student Name -->

<label for="student_name">
    Student Name:
</label>

<input
    type="text"
    id="student_name"
    name="student_name"
    placeholder="Enter Student Name"
    required
>



                <!-- Study Hours -->

                <label>
                    Study Hours:
                </label>

                <select
                    name="study_hours"
                    required
                >

                    <option value="">
                        Select Study Hours
                    </option>

                    <option value="2">
                        2
                    </option>

                    <option value="3">
                        3 
                    </option>

                    <option value="4">
                        4 
                    </option>

                    <option value="5">
                        5
                    </option>

                    <option value="6">
                        6 
                    </option>

                    <option value="7">
                        7
                    </option>

                    <option value="8">
                        8 
                    </option>

                    <option value="9">
                        9 
                    </option>

                    <option value="10">
                        10
                    </option>

                    <option value="12">
                        12 
                    </option>

                </select>



                <!-- Attendance -->

                <label>
                    Attendance (%):
                </label>

                <select
                    name="attendance"
                    required
                >

                    <option value="">
                        Select Attendance
                    </option>

                    <option value="60">
                        60
                    </option>

                    <option value="65">
                        65
                    </option>

                    <option value="70">
                        70
                    </option>

                    <option value="75">
                        75
                    </option>

                    <option value="80">
                        80
                    </option>

                    <option value="85">
                        85
                    </option>

                    <option value="90">
                        90
                    </option>

                    <option value="92">
                        92
                    </option>

                    <option value="95">
                        95
                    </option>

                    <option value="98">
                        98
                    </option>

                </select>



                <!-- Sleep Hours -->

                <label>
                    Sleep Hours:
                </label>

                <select
                    name="sleep_hours"
                    required
                >

                    <option value="">
                        Select Sleep Hours
                    </option>

                    <option value="4">
                        4
                    </option>

                    <option value="5">
                        5.4
                    </option>

                    <option value="6">
                        6
                    </option>

                    <option value="7">
                        7.1
                    </option>

                    <option value="8">
                        8
                    </option>

                    <option value="9">
                        9.3
                    </option>

                    <option value="10">
                        10
                    </option>

                </select>



                <!-- Internet Usage -->

                <label>
                    Internet Usage (Hours):
                </label>

                <select
                    name="internet_usage"
                    required
                >

                    <option value="">
                        Select Internet Usage
                    </option>

                    <option value="1">
                        1.5
                    </option>

                    <option value="2">
                        2
                    </option>

                    <option value="3">
                        3.4
                    </option>

                    <option value="4">
                        4
                    </option>

                    <option value="5">
                        5.6
                    </option>

                    <option value="6">
                        6
                    </option>

                    <option value="7">
                        7.2
                    </option>

                    <option value="8">
                        8
                    </option>

                    <option value="9">
                        9.1
                    </option>

                    <option value="10">
                        10 
                    </option>

                </select>



                <!-- Assignments -->

                <label>
                    Assignments Completed:
                </label>

                <select
                    name="assignments_completed"
                    required
                >

                    <option value="">
                        Select Assignments
                    </option>

                    <option value="2">
                        2 
                    </option>

                    <option value="4">
                        4 
                    </option>

                    <option value="5">
                        5 
                    </option>

                    <option value="6">
                        6 
                    </option>

                    <option value="7">
                        7 
                    </option>

                    <option value="8">
                        8 
                    </option>

                    <option value="9">
                        9 
                    </option>

                    <option value="10">
                        10 
                    </option>

                    <option value="12">
                        12 
                    </option>

                    <option value="15">
                        15
                    </option>

                </select>



                <!-- Previous Score -->

                <label>
                    Previous Score:
                </label>

                <select
                    name="previous_score"
                    required
                >

                    <option value="">
                        Select Previous Score
                    </option>

                    <option value="40">
                        40
                    </option>

                    <option value="45">
                        45
                    </option>

                    <option value="50">
                        50
                    </option>

                    <option value="55">
                        55
                    </option>

                    <option value="60">
                        60
                    </option>

                    <option value="65">
                        65
                    </option>

                    <option value="70">
                        70
                    </option>

                    <option value="75">
                        75
                    </option>

                    <option value="80">
                        80
                    </option>

                    <option value="90">
                        90
                    </option>

                </select>



                <!-- Submit Button -->

          <button type="submit" class="predict-btn">
    🎓 Predict Student Performance
</button>

</form>



            <!-- =================================
                 RESULT AREA
            ================================== -->

            <div class="result">

                <h2>
                    📊 Predicted Performance
                </h2>

                <p>
                    Result will appear after prediction
                </p>

            </div>



            <!-- =================================
                 NAVIGATION LINKS
            ================================== -->

            <div class="back-links">

                <a href="http://127.0.0.1:5000/">
                    Home
                </a>

               </a>
<a href="http://127.0.0.1:5001/history">
    History
</a>

<a href="http://127.0.0.1:5002/dashboard">
    Dashboard
</a>

            </div>


        </div>

    </div>


</body>

</html>
