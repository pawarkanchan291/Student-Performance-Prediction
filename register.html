
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
}

.container{
    width:430px;
    padding:35px;
    background:white;
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
}

.logo{
    text-align:center;
    font-size:42px;
    margin-bottom:10px;
}

h1{
    text-align:center;
    color:#1e3a8a;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#333;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

.register-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:9px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.register-btn:hover{
    background:#1d4ed8;
}

.login-text{
    text-align:center;
    margin-top:20px;
    color:#555;
}

.login-text a{
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

.message{
    padding:12px;
    margin-bottom:15px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.success{
    background:#dcfce7;
    color:#166534;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">🎓</div>

<h1>Create Account</h1>

<p class="subtitle">
Register for Student Performance Prediction
</p>

{% with messages = get_flashed_messages(with_categories=true) %}

{% if messages %}

{% for category, message in messages %}

<div class="message {{ category }}">
{{ message }}
</div>

{% endfor %}

{% endif %}

{% endwith %}


<form action="http://127.0.0.1:5000/register" method="POST">

<div class="form-group">

<label>Full Name</label>

<input
type="text"
name="name"
placeholder="Enter your full name"
required>

</div>


<div class="form-group">

<label>Email Address</label>

<input
type="email"
name="email"
placeholder="Enter your email"
required>

</div>


<div class="form-group">

<label>Password</label>

<input
type="password"
name="password"
placeholder="Create a password"
minlength="6"
required>

</div>


<div class="form-group">

<label>Confirm Password</label>

<input
type="password"
name="confirm_password"
placeholder="Confirm your password"
minlength="6"
required>

</div>


<button
type="submit"
class="register-btn">

Create Account

</button>

</form>


<p class="login-text">

Already have an account?

<a href="http://127.0.0.1:5000/login">
Login
</a>

</p>

</div>

</body>

</html>
```
