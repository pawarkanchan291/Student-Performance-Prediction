<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Performance Prediction</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        /* =========================
           NAVBAR
        ========================== */

        nav {
            background: #1e3a8a;
            color: white;

            padding: 20px 50px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 22px;
        }

        nav div {
            display: flex;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;

            margin-left: 25px;

            font-weight: bold;

            padding: 8px 12px;

            border-radius: 6px;

            transition: 0.3s;
        }

        nav a:hover {
            background: white;
            color: #1e3a8a;
        }

        /* =========================
           HERO
        ========================== */

        .hero {

            min-height: 85vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 30px;
        }

        .hero h1 {

            font-size: 50px;

            margin-bottom: 20px;

            color: #1e3a8a;
        }

        .hero p {

            font-size: 20px;

            margin-bottom: 35px;

            color: #555;
        }

        /* =========================
           START BUTTON
        ========================== */

        .btn {

            background: #2563eb;

            color: white;

            text-decoration: none;

            padding: 14px 28px;

            border-radius: 8px;

            font-size: 17px;

            display: inline-block;

            transition: 0.3s;
        }

        .btn:hover {

            background: #1d4ed8;

            transform: translateY(-2px);
        }

        /* =========================
           MOBILE
        ========================== */

        @media(max-width: 768px) {

            nav {

                flex-direction: column;

                gap: 15px;

            }

            nav div {

                flex-wrap: wrap;

                justify-content: center;

            }

            nav a {

                margin: 5px;

            }

            .hero h1 {

                font-size: 35px;

            }

            .hero p {

                font-size: 17px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav>

        <h2>
            🎓 Student Performance
        </h2>


        <div>

        


            <!-- PREDICT -->

         <a href="http://127.0.0.1:5000/">
    Home
</a>
<a href="http://127.0.0.1:5000/predict">
    Predict
</a>
<a href="http://127.0.0.1:5001/history">
    History
</a>

<a href="http://127.0.0.1:5002/dashboard">
    Dashboard
</a>

        </div>

    </nav>


    <!-- =========================
         HERO SECTION
    ========================== -->

    <section class="hero">

        <h1>
            Student Performance Prediction
        </h1>


        <p>
            Predict student academic performance
            using Machine Learning.
        </p>


    <a href="http://127.0.0.1:5000/predict" class="btn">
    🎓 Start Prediction
</a>

    </section>


</body>

</html>
