<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a,
                #2563eb
            );
        }

        .container {
            width: 400px;

            padding: 40px;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;

            font-size: 45px;

            margin-bottom: 10px;
        }

        h1 {
            text-align: center;

            color: #1e3a8a;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #666;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #333;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 9px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 5px rgba(37,99,235,0.3);
        }

        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .register-text {
            text-align: center;

            margin-top: 22px;

            color: #555;
        }

        .register-text a {
            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 12px;

            margin-bottom: 15px;

            border-radius: 8px;

            text-align: center;

            font-weight: bold;
        }

        .error {
            background: #fee2e2;

            color: #991b1b;
        }

        .success {
            background: #dcfce7;

            color: #166534;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">
        🎓
    </div>


    <h1>
        Welcome Back
    </h1>


    <p class="subtitle">
        Login to Student Performance Prediction
    </p>


    <!-- FLASH MESSAGE -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="message {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- LOGIN FORM -->

    <form
        action="http://127.0.0.1:5000/login"
        method="POST">


        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required>

        </div>


        <button
            type="submit"
            class="login-btn">

            Login

        </button>


    </form>


    <!-- REGISTER LINK -->

    <p class="register-text">

        Don't have an account?

        <a href="http://127.0.0.1:5000/register">
            Create Account
        </a>

    </p>


</div>


</body>

</html>
